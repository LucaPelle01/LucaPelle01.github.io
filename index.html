<!doctype html>
<html lang="it" data-dark="false">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Luca Pellegrini — work in progress.">
  <title>Luca Pellegrini</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400&display=swap">
  <style>
    :root { color-scheme: light; --bg:#fafafa; --ink:#202020; --frame:rgba(32,32,32,.22); }
    :root[data-dark="true"] { color-scheme:dark; --bg:#111111; --ink:#e8e8e8; --frame:rgba(232,232,232,.25); }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    body { margin:0; min-height:100svh; display:grid; place-items:center;
      background:var(--bg); color:var(--ink); font-family:Roboto,"Helvetica Neue",Arial,sans-serif;
      -webkit-font-smoothing:antialiased; }
    main { width:min(660px,calc(100% - 40px)); padding:40px 0; text-align:center; }
    #theme { display:grid; place-items:center; width:44px; height:44px; margin:0 auto 25px;
      border:0; padding:0; color:inherit; background:none; cursor:pointer; opacity:.6; }
    #theme:hover { opacity:1; }
    #theme svg { width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round; }
    #theme .sun, [data-dark="true"] #theme .moon { display:none; }
    [data-dark="true"] #theme .sun { display:block; }
    #fluid-stage { position:relative; width:100%; aspect-ratio:2.4; outline:none; touch-action:pan-y; overflow:hidden; }
    #fluid-stage::after { content:""; position:absolute; inset:0; border:1px solid var(--frame); pointer-events:none; }
    #fluid-stage:focus-visible { outline:1px dotted currentColor; outline-offset:7px; }
    #theme:focus-visible { outline:1px solid currentColor; outline-offset:3px; border-radius:50%; }
    canvas { display:block; width:100%; height:100%; }
    h1 { margin:32px 0 0; font-size:clamp(15px,2.5vw,17px); font-weight:400;
      line-height:1.8; letter-spacing:.07em; }
    h1 span { display:block; }
    #status { margin:18px 0 0; font-size:12px; opacity:.6; }
    @media(max-width:480px) { main { width:calc(100% - 28px); } h1 { margin-top:25px; } }
  </style>
</head>
<body>
  <main>
    <button id="theme" type="button" aria-label="Attiva il tema scuro" aria-pressed="false">
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 14A8.6 8.6 0 0 1 10 3.6 8.6 8.6 0 1 0 20.4 14Z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.8"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.2-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
    </button>
    <div id="fluid-stage" tabindex="0" role="group" aria-label="Flusso interattivo. Muovi il puntatore o usa le frecce per spostare il cilindro.">
      <canvas id="fluid-canvas" aria-hidden="true"></canvas>
    </div>
    <h1><span>WORK IN PROGRESS...</span><span>LUCA</span></h1>
    <p id="status" role="status" hidden></p>
  </main>
  <script type="module" src="./fluid-gpu.js?v=flow-2"></script>
</body>
</html>
